[project]
name = "primitive-db"
version = "0.1.0"
description = "Консольная база данных с хранением таблиц в JSON"
authors = [{ name = "Pyotr Pavlov", email = "pavlov_pete.05@mail.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"
project = "primitive_db.main:main"

[tool.poetry]
packages = [{ include = "primitive_db", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "0.17.2"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff==0.17.2",
]
